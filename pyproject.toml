[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "midivoder"
version = "0.1.0"
description = "Vocode a voice WAV into a multi-channel General MIDI file."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "librosa>=0.10",
    "matplotlib>=3.7",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "black>=24",
    "pylint>=3",
    "tqdm>=4",
]
eval = [
    "faster-whisper>=1.0",
    "jiwer>=3",
    "pystoi>=0.4",
    "tqdm>=4",
]

[project.scripts]
midivoder = "midivoder.cli:main"

[tool.setuptools.packages.find]
include = ["midivoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "fidelity: end-to-end fidelity test requiring fluidsynth + espeak-ng (Docker)",
]

[tool.black]
target-version = ["py310", "py311", "py312"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint."messages control"]
disable = [
    "redefined-outer-name",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-few-public-methods",
]

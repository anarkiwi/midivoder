name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: midivoder-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: black
        run: docker run --rm midivoder-test black --check midivoder tests
      - name: pylint
        run: docker run --rm midivoder-test pylint midivoder tests
      - name: pytest
        run: docker run --rm midivoder-test
